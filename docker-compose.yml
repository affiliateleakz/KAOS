name: kaos
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      KAOS_PAPER_JOURNAL_PATH: /var/lib/kaos/paper_journal.db
    volumes: [paper-journal:/var/lib/kaos]
    ports: ["8001:8001"]
    depends_on:
      mongo: { condition: service_healthy }
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm start"
    environment:
      REACT_APP_BACKEND_URL: ""
      KAOS_API_PROXY: http://api:8001
      BROWSER: none
      WDS_SOCKET_PORT: "0"
    ports: ["3000:3000"]
    volumes: [./apps/web:/app, web-node-modules:/app/node_modules]
    depends_on: [api]
volumes:
  paper-journal:
  mongo-data:
  web-node-modules:
