name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    strategy:
      fail-fast: false
      matrix:
        suite: [apps/api, services/collectors, packages/kaos-core, research/strategy_v2, research/strategy_v2_1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install pytest numpy pandas
          if [ "${{ matrix.suite }}" = "apps/api" ]; then pip install -r apps/api/requirements.txt; fi
      - name: Test
        working-directory: ${{ matrix.suite }}
        env: { MONGO_URL: "mongodb://localhost:27017", DB_NAME: kaos_test, PYTHONPATH: "${{ github.workspace }}/packages/kaos-core" }
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env: { CI: "false" }
      - name: Version compiled portal
        run: printf '%s\\n' "$GITHUB_SHA" > build/kaos-build-revision.txt
      - name: Package static React portal for isolated hosting
        uses: actions/upload-artifact@v4
        with:
          name: kaos-react-portal-${{ github.sha }}
          path: apps/web/build/
          if-no-files-found: error
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
