name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    strategy:
      fail-fast: false
      matrix:
        suite: [apps/api, services/collectors, packages/kaos-core, research/strategy_v2, research/strategy_v2_1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install pytest numpy pandas
          if [ "${{ matrix.suite }}" = "apps/api" ]; then pip install -r apps/api/requirements.txt; fi
      - name: Test
        working-directory: ${{ matrix.suite }}
        env: { MONGO_URL: "mongodb://localhost:27017", DB_NAME: kaos_test, PYTHONPATH: "${{ github.workspace }}/packages/kaos-core" }
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Validate cPanel paper API and portal installers
        run: bash -n ../../scripts/deploy-kaos-paper-api-cpanel.sh ../../scripts/deploy-isolated-kaos-portal-cpanel.sh ../../scripts/install-kaos-r2-train-cron-cpanel.sh ../../scripts/run-kaos-r2-training-worker-cpanel.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://api.tradingwithkaos.com"
      - name: Version compiled portal
        run: echo "$GITHUB_SHA" > build/kaos-build-revision.txt
      - name: Package static React portal for isolated hosting
        uses: actions/upload-artifact@v4
        with:
          name: kaos-react-portal-${{ github.sha }}
          path: apps/web/build/
          if-no-files-found: error
          retention-days: 14
  publish_cpanel_portal:
    name: Publish compiled cPanel portal to Git branch
    needs: [python, web, secrets]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated React build
        uses: actions/download-artifact@v4
        with:
          name: kaos-react-portal-${{ github.sha }}
          path: compiled
      - name: Verify compiled portal revision and production API target
        shell: bash
        run: |
          set -euo pipefail
          test -s compiled/index.html
          test -d compiled/static/js
          test -s compiled/kaos-build-revision.txt
          test "$(cat compiled/kaos-build-revision.txt)" = "$GITHUB_SHA"
          grep -Rlq --include='*.js' 'api.tradingwithkaos.com' compiled/static/js
      - name: Publish static files ONLY to dedicated Git build branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd compiled
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b kaos-cpanel-build
          git add -A
          git commit -qm "Compiled KAOS portal for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/kaos-cpanel-build

  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
