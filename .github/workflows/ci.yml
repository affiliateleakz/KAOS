name: CI
# CI runs on PR changes again. New commits cancel superseded runs to save minutes.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: kaos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    strategy:
      fail-fast: false
      matrix:
        suite: [apps/api, services/collectors, packages/kaos-core, research/strategy_v2, research/strategy_v2_1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          pip install pytest numpy pandas
          if [ "${{ matrix.suite }}" = "apps/api" ]; then pip install -r apps/api/requirements.txt; fi
      - name: Test
        working-directory: ${{ matrix.suite }}
        env: { MONGO_URL: "mongodb://localhost:27017", DB_NAME: kaos_test, PYTHONPATH: "${{ github.workspace }}/packages/kaos-core" }
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://api.tradingwithkaos.com"
      - name: Archive built KAOS website
        uses: actions/upload-artifact@v4
        with:
          name: kaos-website-build
          path: apps/web/build/
          if-no-files-found: error
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install research test dependencies
        run: python -m pip install pytest
      - name: Test multi-horizon and catalyst research
        env:
          PYTHONPATH: ${{ github.workspace }}/research
        run: |
          if [ -f research/test_multi_horizon_dataset.py ]; then
            python -m pytest -q research/test_multi_horizon_dataset.py research/test_point_in_time_events.py research/test_catalyst_learning_rows.py research/test_chart_pattern_features.py research/test_market_feature_join.py
          else
            echo "Research learning suite not present in this branch; enabled when PR #52 is merged"
          fi

  extension-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Validate Chrome manifest and required extension scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("apps/extension")
          m = json.loads((root / "manifest.json").read_text())
          assert m["manifest_version"] == 3
          assert m["name"] == "KAOS Trading Bot"
          assert m["version"]
          scripts = [m["background"]["service_worker"]]
          for block in m.get("content_scripts", []):
              scripts.extend(block.get("js", []))
              scripts.extend(block.get("css", []))
          for file in scripts:
              if not (root / file).is_file():
                  raise AssertionError(f"Missing extension runtime asset: {file}")
          print(f"Checked {len(scripts)} extension runtime assets")
          PY
      - name: Verify Pocket Option login isolation
        run: |
          python -m pip install pytest
          python -m pytest -q apps/extension/test_broker_login_isolation.py
      - name: Test extension login runtime compatibility
        run: node --test apps/extension/test_cloud_login.cjs
      - name: Syntax-check extension JavaScript
        run: |
          node --check apps/extension/background.js
          node --check apps/extension/content.js
          node --check apps/extension/kaos-cloud-ui.js
          node --check apps/extension/kaos-cloud.js
          node --check apps/extension/popup.js

  release-packages:
    runs-on: ubuntu-latest
    needs: [extension-smoke, web, python, secrets, research]
    steps:
      - uses: actions/checkout@v4
      - name: Build Chrome Web Store ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          root = Path("apps/extension")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["manifest_version"] == 3
          out = Path("dist")
          out.mkdir(exist_ok=True)
          files = sorted(p for p in root.rglob("*") if p.is_file() and
                         "__pycache__" not in p.parts and not p.name.startswith(".") and
                         p.suffix.lower() not in (".pyc", ".zip"))
          assert (root / "popup.html") in files
          assert (root / "manifest.json") in files
          with ZipFile(out / "kaos-chrome-extension.zip", "w", ZIP_DEFLATED) as archive:
              for p in files:
                  archive.write(p, p.relative_to(root).as_posix())
          with ZipFile(out / "kaos-chrome-extension.zip") as archive:
              assert "manifest.json" in archive.namelist()
              assert "popup.html" in archive.namelist()
              assert len(archive.namelist()) == len(set(archive.namelist()))
              print("Chrome extension package files:", len(archive.namelist()))
          PY
      - name: Upload Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: kaos-chrome-extension-zip
          path: dist/kaos-chrome-extension.zip
          if-no-files-found: error
          retention-days: 14

  cpanel-packages:
    runs-on: ubuntu-latest
    needs: [web, python, secrets, research, extension-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled website
        uses: actions/download-artifact@v4
        with:
          name: kaos-website-build
          path: apps/web/build
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Test private release staging
        run: |
          python -m pip install pytest
          python -m pytest -q scripts/tests
      - name: Build ready-to-upload cPanel packages
        run: python scripts/build_cpanel_packages.py
      - name: Upload website cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kaos-cpanel-website
          path: dist/kaos-cpanel-website.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload backend cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kaos-cpanel-backend
          path: dist/kaos-cpanel-backend.zip
          if-no-files-found: error
          retention-days: 14
