name: Build KAOS website for cPanel (no npm on hosting)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/build-cpanel-website.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build KAOS for the production API
        run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://api.tradingwithkaos.com"
      - name: Check build output and API endpoint origin
        run: |
          test -s build/index.html
          test -d build/static
          if grep -R -l "localhost:8000" build/static/js >/dev/null 2>&1; then
            echo "ERROR: local development API URL found in production JavaScript"
            exit 1
          fi
      - name: Attach cPanel-ready website files
        uses: actions/upload-artifact@v4
        with:
          name: kaos-website-cpanel-${{ github.sha }}
          path: apps/web/build/
          if-no-files-found: error
          retention-days: 30

      - name: Publish built static website to deployment branch
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p kaos-cpanel-publish
          cd kaos-cpanel-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b kaos-cpanel-build
          cp -a "$GITHUB_WORKSPACE/apps/web/build/." .
          printf '%s\n' "$REVISION" > kaos-build-revision.txt
          git add -A
          git commit -m "Build KAOS website from $REVISION"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin HEAD:refs/heads/kaos-cpanel-build
